name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          if (Test-Path requirements_dev.txt) { pip install -r requirements_dev.txt }
          if (Test-Path requirements_gui.txt) { pip install -r requirements_gui.txt }
          pip install -e .

      - name: Build standalone executable
        shell: pwsh
        run: |
          Set-Location ${{ github.workspace }}
          .\scripts\build_exe.ps1 -PythonExe python -Name "ZorvanNewUI"

      - name: Upload built executable as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zorvan-windows-exe
          path: dist\ZorvanNewUI.exe

      - name: Create or update GitHub release and upload executable
        uses: softprops/action-gh-release@v1
        with:
          files: dist/ZorvanNewUI.exe
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "Built Windows executable for tag ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
