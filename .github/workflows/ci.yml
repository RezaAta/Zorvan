name: CI

on:
  push:
    branches: ["main", "master", "MVVM-UI-Migration"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  core:
    name: Core checks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt', '**/requirements_dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt; fi
          pip install -e .
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Advisory lint checks
        run: |
          pre-commit run --all-files || true
          ruff check . || true
          cz check || true

      - name: Run core regression tests
        run: |
          pytest -q Tests/test_sequence_finder.py

  gui-smoke:
    name: GUI smoke (py3.11)
    runs-on: ubuntu-latest
    needs: core
    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gui-${{ hashFiles('**/requirements.txt', '**/requirements_dev.txt', '**/requirements_gui.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-gui-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt; fi
          if [ -f requirements_gui.txt ]; then pip install -r requirements_gui.txt; fi
          pip install -e .
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            graphviz \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libxkbcommon0 \
            libx11-xcb1 \
            libxcb1 \
            libxrender1 \
            libxrandr2 \
            libxcursor1 \
            libxcomposite1 \
            libxdamage1 \
            libnss3 \
            libasound2 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libgtk-3-0

      - name: Run GUI smoke test
        run: |
          xvfb-run -a pytest -q gui_tests/integration/test_gui_smoke.py --maxfail=1
