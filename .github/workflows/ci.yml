name: CI - Advisory Checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements_dev.txt', '**/requirements_gui.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt; fi
            pip install -e .
            # Ensure system 'graphviz' is available for graphdot rendering
            sudo apt-get update && sudo apt-get install -y graphviz

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Run Commitizen check
        run: cz check || true

      - name: Static analysis - ruff
        run: ruff check . || true

      - name: Run tests (non-GUI)
        run: pytest -q --maxfail=1

  gui-tests:
    name: GUI Tests (optional)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements_dev.txt', '**/requirements_gui.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt; fi
            if [ -f requirements_gui.txt ]; then pip install -r requirements_gui.txt; fi
            pip install -e .
            # GUI tests need system graphviz and various Qt/OpenGL libraries
            sudo apt-get update && sudo apt-get install -y \
              graphviz \
              libegl1 \
              libgl1-mesa-dri \
              libgl1 \
              libgbm1 \
              libxkbcommon0 \
              libxcb-xinerama0 \
              libx11-xcb1 \
              libxcb1 \
              libxrender1 \
              libxrandr2 \
              libxcursor1 \
              libxcomposite1 \
              libxdamage1 \
              libnss3 \
              libasound2 || sudo apt-get install -y libasound2t64 \
              libatk1.0-0 \
              libatk-bridge2.0-0 \
              libgtk-3-0
            # Some runners use different package names; try fallback packages if needed.
            sudo apt-get install -y libegl1-mesa libgl1-mesa-dri libasound2t64 || true

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run GUI tests
        run: xvfb-run -a pytest -q --maxfail=1

      - name: Upload coverage (optional)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
