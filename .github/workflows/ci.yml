name: CI - Advisory Checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements_dev.txt', '**/requirements_gui.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt; fi
            pip install -e .
            # Ensure system 'graphviz' is available for graphdot rendering
            sudo apt-get update && sudo apt-get install -y graphviz

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Run Commitizen check
        run: cz check || true

      - name: Static analysis - ruff
        run: ruff check . || true

      - name: Run tests (non-GUI)
        run: pytest -q --maxfail=1

  gui-tests:
    name: GUI Tests (optional)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements_dev.txt', '**/requirements_gui.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            if [ -f requirements_dev.txt ]; then pip install -r requirements_dev.txt; fi
            if [ -f requirements_gui.txt ]; then pip install -r requirements_gui.txt; fi
            pip install -e .
            # GUI tests need system graphviz and various Qt/OpenGL libraries.
            # Try installing a primary package set; if that fails, try a secondary (fallback) set.
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              graphviz \
              libegl1 \
              libegl1-mesa \
              libegl-mesa0 \
              libwayland-egl1 \
              libgl1-mesa-glx \
              libgles2-mesa \
              mesa-utils \
              libgl1-mesa-dri \
              libgl1 \
              libglvnd0 \
              libglx0 \
              libgbm1 \
              libxkbcommon0 \
              libxcb-xinerama0 \
              libx11-xcb1 \
              libxcb1 \
              libxrender1 \
              libxrandr2 \
              libxcursor1 \
              libxcomposite1 \
              libxdamage1 \
              libnss3 \
              libasound2 \
              libatk1.0-0 \
              libatk-bridge2.0-0 \
              libgtk-3-0 || (
              sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              graphviz \
              libegl1-mesa \
              libegl-mesa0 \
              libwayland-egl1 \
              libgl1-mesa-dri \
              mesa-utils \
              libasound2t64 \
              libatk1.0-0 \
              libatk-bridge2.0-0 \
              libgtk-3-0 || true )

      - name: Debug installed EGL/GL libraries
        run: |
          echo "OS release:" && lsb_release -a || cat /etc/os-release || true
          echo "## ldconfig -p | grep EGL"
          sudo ldconfig -p | grep -E 'lib(EGL|GL)' || true
          echo "## Check for files in /usr/lib*"
          ls -l /usr/lib*/libEGL* || true
          echo "## dpkg-query for egl/gl packages"
          dpkg-query -W -f='${Package}\t${Status}\t${Version}\n' 'libegl*' 'libgl*' 'mesa*' || true

      - name: Show apt policy and attempt explicit libegl install
        run: |
          echo "## apt-cache policy for libegl packages"
          apt-cache policy libegl-mesa0 libegl1 libegl1-mesa libgbm1 || true
          echo "## Attempt explicit install of libegl-mesa0 and related packages"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl-mesa0 libegl1-mesa libgbm1 libgl1-mesa-dri || true
          echo "## Run ldconfig to refresh dynamic linker cache"
          sudo ldconfig
          echo "## ldconfig -p | grep EGL after explicit install"
          sudo ldconfig -p | grep -E 'lib(EGL|GL)' || true
          echo "## Check for files in /usr/lib* after explicit install"
          ls -l /usr/lib*/libEGL* || true
          echo "## dpkg listing after explicit install"
          dpkg -l | grep -E 'libegl|libgbm|mesa|libgl' || true

      - name: Find Qt shared libraries and show missing deps
        run: |
          echo "## Finding Qt libraries"
          set -x
          find /usr -name 'libQt6*.so*' -print 2>/dev/null | head -n 50 || true
          echo "## ldd each Qt library (show 'not found' lines)"
          for f in $(find /usr -name 'libQt6*.so*' -type f 2>/dev/null | head -n 50); do
            echo "--- $f ---"
            ldd "$f" | grep 'not found' || true
          done

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Validate GUI environment
        run: |
          python - <<PY
          try:
            import PyQt6
            from PyQt6.QtWidgets import QApplication
            print('PyQt6 import ok')
          except Exception as e:
            print('PyQt6 import failed', e)
            raise
          PY

      - name: Run GUI tests
        run: xvfb-run -a pytest -q --maxfail=1

      - name: Upload coverage (optional)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
