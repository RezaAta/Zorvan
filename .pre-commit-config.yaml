repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 24.1.0
    hooks:
      - id: black
        args: ["--line-length", "88"]

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort

  # Note: ruff checks are still run in CI; the pre-commit ruff hook was removed because
  # some ruff releases are unclonable by pre-commit (pre-commit requires a stable tag).
  # Keep ruff in CI: `ruff check .` (see .github/workflows/ci.yml).

  # Optional: run tests locally via pre-commit (use cautiously)
  # Running the full test suite as part of pre-commit can be slow and fragile due
  # to environment differences (e.g. GUI dependencies). Tests run in CI where
  # required deps are available, so keep pre-commit local hooks focused on style.

  - repo: local
    hooks:
      - id: commitizen-check
        name: commitizen message check
        entry: cz check
        language: python
        stages: [commit-msg]
